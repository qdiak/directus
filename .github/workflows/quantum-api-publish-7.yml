name: Publish Quantum API 19.0.3-quantum.7

# Ez a kiadás csak az API-t frissíti; a V1 .2 és a CLI/app csomag változatlan.
on:
  push:
    tags:
      - quantum-api-publish/19.0.3-quantum.7-r1
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-quantum-api-7
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact release source and version
        env:
          SOURCE_SHA: fcd19b41eef07573cfd7faa2e723def71e9f1eca
        run: |
          test "$GITHUB_REF" = 'refs/tags/quantum-api-publish/19.0.3-quantum.7-r1'
          test "$(git rev-parse HEAD^)" = 4a475a01e5413baf5da61c4dd068017721b0426a
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = '.github/workflows/quantum-api-publish-7.yml'
          test "$(jq -r .version api/package.json)" = '19.0.3-quantum.7'
          test "$(jq -r .version app/package.json)" = '12.0.3-quantum.6'
          test "$(jq -r .version directus/package.json)" = '10.10.8-quantum.6'
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v3
        with:
          version: 8.15.4
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Validate changed source
        run: pnpm --filter quantum_directus_api check:changed
        env:
          DIRECTUS_CHECK_BASE: eee967867e63015f9d9722d23280f92a83ce2f7d
      - name: Build API production closure
        run: pnpm --filter quantum_directus_api... build
        env:
          npm_config_workspace_concurrency: '1'
      - run: pnpm --filter quantum_directus_api test:embedded
      - name: Pack only the API
        run: |
          mkdir -p /tmp/quantum-api-release
          pnpm --filter quantum_directus_api exec pnpm pack --pack-destination /tmp/quantum-api-release
          tar -xOf /tmp/quantum-api-release/quantum_directus_api-19.0.3-quantum.7.tgz package/package.json > /tmp/quantum-api-manifest.json
          test "$(jq -r .name /tmp/quantum-api-manifest.json)" = quantum_directus_api
          test "$(jq -r .version /tmp/quantum-api-manifest.json)" = 19.0.3-quantum.7
          test "$(jq -r '.dependencies.quantum_directus_app' /tmp/quantum-api-manifest.json)" = 12.0.3-quantum.6
          test "$(jq -r '.dependencies["isolated-vm"]' /tmp/quantum-api-manifest.json)" = null
      - name: Publish and verify the exact canary artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          archive=/tmp/quantum-api-release/quantum_directus_api-19.0.3-quantum.7.tgz
          expected="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          registry=https://registry.npmjs.org/quantum_directus_api/19.0.3-quantum.7
          latest_before="$(npm view quantum_directus_api dist-tags.latest)"
          if curl --silent --show-error --fail "$registry" > /tmp/quantum-api-published.json; then
            test "$(jq -r .dist.integrity /tmp/quantum-api-published.json)" = "$expected"
          else
            npm publish "$archive" --access public --tag canary
          fi
          curl --retry 6 --retry-all-errors --retry-delay 10 --silent --show-error --fail "$registry" > /tmp/quantum-api-published.json
          test "$(jq -r .dist.integrity /tmp/quantum-api-published.json)" = "$expected"
          test "$(npm view quantum_directus_api dist-tags.latest)" = "$latest_before"
          test "$(npm view quantum_directus_api dist-tags.canary)" = 19.0.3-quantum.7
