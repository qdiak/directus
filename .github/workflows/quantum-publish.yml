name: Publish Quantum packages

# ÁTMENETI(quantum.6): ez a tag-gate a három előkészített .6 csomag egyszeri,
# idempotensen újrafuttatható kiadását védi. A kiadás lezárása után törlendő,
# vagy külön döntéssel általános, manifestből verziózott Quantum release flow-vá alakítandó.

on:
  # A workflow_dispatch csak akkor hívható API-ból, ha ez a workflow már a
  # repository default branchén is létezik. A fork release branchét ezért egy
  # pontos, egyszer használható, nem upstream-v* tag aktiválja. Más tag vagy
  # későbbi Quantum verzió nem örökli ezt a felhatalmazást.
  push:
    tags:
      - quantum-publish/10.10.8-quantum.6
permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: publish-quantum-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Quantum package trio
    if: github.ref == 'refs/tags/quantum-publish/10.10.8-quantum.6'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=6144
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify release authorization and commit
        id: authorization
        env:
          AUTHORIZED_PARENT_SHA: 708dceec45b7444dbb328b56f9fa39b64336dc59
        run: |
          actual_sha="$(git rev-parse HEAD)"
          actual_parent="$(git rev-parse HEAD^)"
          changed_files="$(git diff --name-only "$AUTHORIZED_PARENT_SHA" "$actual_sha")"

          if [ "$GITHUB_REF" != 'refs/tags/quantum-publish/10.10.8-quantum.6' ]; then
            echo "Refusing unexpected release tag: $GITHUB_REF" >&2
            exit 1
          fi

          if [ "$actual_parent" != "$AUTHORIZED_PARENT_SHA" ]; then
            echo "Refusing release commit with an unexpected parent: expected=$AUTHORIZED_PARENT_SHA actual=$actual_parent" >&2
            exit 1
          fi

          if [ "$changed_files" != '.github/workflows/quantum-publish.yml' ]; then
            echo "Refusing release commit with non-workflow changes:" >&2
            printf '%s\n' "$changed_files" >&2
            exit 1
          fi

          echo "target_sha=$actual_sha" >> "$GITHUB_OUTPUT"

      # A tag maga az explicit kiadási felhatalmazás, de nem helyettesíti a
      # validációt: a csomagok csak a tag által mutatott SHA teljes Node/Bun
      # embedded runtime gate-jének sikere után kerülhetnek a registrybe.
      - name: Wait for the matching embedded runtime gate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.authorization.outputs.target_sha }}
        run: |
          for attempt in $(seq 1 80); do
            run_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow quantum-embedded.yml \
              --branch 10.10.8-quantum \
              --commit "$TARGET_SHA" \
              --event push \
              --limit 1 \
              --json databaseId,headSha,status,conclusion \
              --jq '.[0]')"

            if [ -z "$run_json" ]; then
              sleep 15
              continue
            fi

            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion' <<<"$run_json")"

            if [ "$status" = 'completed' ]; then
              if [ "$conclusion" != 'success' ]; then
                echo "Matching embedded runtime gate failed: $run_json" >&2
                exit 1
              fi

              echo "Matching embedded runtime gate passed: $run_json"
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for the embedded runtime gate for $TARGET_SHA" >&2
          exit 1

      - name: Install build Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.4
          run_install: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Quantum package closure
        run: pnpm --filter quantum_directus_api... build
        env:
          npm_config_workspace_concurrency: '1'

      - name: Install npm OIDC runtime
        uses: actions/setup-node@v4
        with:
          # Az npm trusted publishing legalább Node 22.14-et és npm 11.5.1-et
          # igényel; a Node 24 runner mindkettőt támogatottan biztosítja.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # A Quantum verziók prerelease-ek: a canary tag publikálhatóvá teszi az
      # exact .6 csomagokat anélkül, hogy a korábbi .2 latest taget átírná.
      # A csomagonkénti ellenőrzés egy részben sikerült kiadás biztonságos
      # folytatását is lehetővé teszi ugyanarról a változatlan commitról.
      - name: Publish exact Quantum package trio
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          publish_if_missing() {
            package_dir="$1"
            package_name="$2"
            package_version="$3"
            package_spec="$package_name@$package_version"
            registry_url="https://registry.npmjs.org/$package_name/$package_version"

            if curl --silent --show-error --fail "$registry_url" >/dev/null 2>&1; then
              echo "publish=skipped package=$package_spec reason=already-exists"
              return
            fi

            # A trusted publisher OIDC tokencseréjét az npm CLI végzi, ezért a
            # pnpm 8 publish ezen a biztonsági határon nem használható.
            # Az npm 11 a sikeres feltöltés után is adhat hibás exit kódot; csak
            # a registry exact verziójának megjelenése számít sikernek.
            if ! npm publish "$package_dir" \
              --access=public \
              --tag canary; then
              echo "npm publish returned a non-zero exit code for $package_spec; verifying the registry"
            fi

            for attempt in $(seq 1 30); do
              if curl --silent --show-error --fail "$registry_url" >/dev/null 2>&1; then
                echo "publish=verified package=$package_spec"
                return
              fi

              sleep 10
            done

            echo "Published package did not become available: $package_spec" >&2
            exit 1
          }

          publish_if_missing ./app quantum_directus_app 12.0.3-quantum.6
          publish_if_missing ./api quantum_directus_api 19.0.3-quantum.6
          publish_if_missing ./directus quantum_directus 10.10.8-quantum.6

      - name: Verify published versions and tags
        run: |
          verify_release() {
            package_name="$1"
            expected_version="$2"
            package_spec="$package_name@$expected_version"
            package_metadata="$(curl --silent --show-error --fail \
              "https://registry.npmjs.org/$package_name")"
            actual_version="$(jq -r --arg version "$expected_version" \
              '.versions[$version].version // empty' <<<"$package_metadata")"
            canary_version="$(jq -r '."dist-tags".canary // empty' <<<"$package_metadata")"

            if [ "$actual_version" != "$expected_version" ]; then
              echo "Published version mismatch: expected=$expected_version actual=$actual_version" >&2
              exit 1
            fi

            if [ "$canary_version" != "$expected_version" ]; then
              echo "Canary tag mismatch: expected=$expected_version actual=$canary_version" >&2
              exit 1
            fi
          }

          verify_release quantum_directus_app 12.0.3-quantum.6
          verify_release quantum_directus_api 19.0.3-quantum.6
          verify_release quantum_directus 10.10.8-quantum.6
