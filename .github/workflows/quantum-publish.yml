name: Publish Quantum packages

# Ez a kiadási kapu kizárólag a CU-123vqc2c1m3 közös .9 latest kiadását engedi.
on:
  push:
    tags:
      - quantum-publish/10.10.8-quantum.9
      - quantum-publish/10.10.8-quantum.9-retry*
permissions:
  actions: read
  contents: read
  id-token: write
concurrency:
  group: publish-quantum-packages
  cancel-in-progress: false
jobs:
  publish:
    name: Publish verified Quantum package trio to latest
    if:
      github.ref == 'refs/tags/quantum-publish/10.10.8-quantum.9' || startsWith(github.ref,
      'refs/tags/quantum-publish/10.10.8-quantum.9-retry')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=6144
    steps:
      - uses: actions/checkout@v4
      - name: Require successful source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          if [ "$source_sha" != "$GITHUB_SHA" ]; then exit 1; fi
          gate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quantum-embedded.yml \
            --commit "$source_sha" --limit 30 --json headSha,status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")][0].headSha // empty')"
          if [ "$gate" != "$source_sha" ]; then
            echo "No successful complete embedded runtime gate for $source_sha" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v3
        with:
          version: 8.15.4
          run_install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build exact release closure
        run: pnpm --filter quantum_directus_api... build
        env:
          npm_config_workspace_concurrency: '1'
      - name: Publish verified exact trio and promote latest
        run: node api/scripts/publish-quantum-release.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Preserve release and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantum-release-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: warn
