name: Publish Quantum API

# Általános, tagből verziózott API-only kiadás. A korábbi, verziónként másolt
# quantum-api-publish-N.yml fájlok kézi SOURCE_SHA-kitöltést igényeltek; itt a
# tag neve adja a verziót, a forrás pedig csak a release branch fejéről vagy
# egy annak történetében lévő commitról jöhet. A CLI/app csomag változatlan marad.
on:
  push:
    tags:
      - 'quantum-api-publish/*'
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-quantum-api
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=6144
      RELEASE_BRANCH: 10.10.8-quantum
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the release version from the tag and verify the source
        id: release
        run: |
          version="${GITHUB_REF#refs/tags/quantum-api-publish/}"
          # Csak exact quantum.N verzió adható ki; -rN retry suffix a verzióban nem szerepel.
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-quantum\.[0-9]+$'
          test "$(jq -r .version api/package.json)" = "$version"
          test "$(jq -r .version app/package.json)" = '12.0.3-quantum.6'
          test "$(jq -r .version directus/package.json)" = '10.10.8-quantum.6'
          # A kiadott commitnak a release branch történetében kell lennie: a tag
          # nem hozhat be a branchen kívüli, review nélküli változást.
          git fetch --no-tags origin "$RELEASE_BRANCH"
          git merge-base --is-ancestor HEAD "origin/$RELEASE_BRANCH"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v3
        with:
          version: 8.15.4
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Build API production closure
        run: pnpm --filter quantum_directus_api... build
        env:
          npm_config_workspace_concurrency: '1'
      - run: pnpm --filter quantum_directus_api test:embedded
      - name: Pack only the API
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p /tmp/quantum-api-release
          pnpm --filter quantum_directus_api exec pnpm pack --pack-destination /tmp/quantum-api-release
          tar -xOf "/tmp/quantum-api-release/quantum_directus_api-$VERSION.tgz" package/package.json > /tmp/quantum-api-manifest.json
          test "$(jq -r .name /tmp/quantum-api-manifest.json)" = quantum_directus_api
          test "$(jq -r .version /tmp/quantum-api-manifest.json)" = "$VERSION"
          test "$(jq -r '.dependencies.quantum_directus_app' /tmp/quantum-api-manifest.json)" = 12.0.3-quantum.6
          test "$(jq -r '.dependencies["isolated-vm"]' /tmp/quantum-api-manifest.json)" = null
      - name: Publish and verify the exact canary artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          archive="/tmp/quantum-api-release/quantum_directus_api-$VERSION.tgz"
          registry="https://registry.npmjs.org/quantum_directus_api/$VERSION"
          latest_before="$(npm view quantum_directus_api dist-tags.latest)"
          if ! curl --silent --show-error --fail "$registry" > /tmp/quantum-api-published.json; then
            npm publish "$archive" --access public --tag canary
          fi
          curl --retry 6 --retry-all-errors --retry-delay 10 --silent --show-error --fail "$registry" > /tmp/quantum-api-published.json
          curl --silent --show-error --fail "$(jq -r .dist.tarball /tmp/quantum-api-published.json)" > /tmp/quantum-api-registry.tgz
          test "$(jq -r .dist.integrity /tmp/quantum-api-published.json)" = "sha512-$(openssl dgst -sha512 -binary /tmp/quantum-api-registry.tgz | openssl base64 -A)"
          mkdir -p /tmp/quantum-api-local /tmp/quantum-api-remote
          tar -xzf "$archive" -C /tmp/quantum-api-local
          tar -xzf /tmp/quantum-api-registry.tgz -C /tmp/quantum-api-remote
          # npm publish újraformázza a package.json-t; a tartalmat normalizálva,
          # minden más csomagfájlt bájtra pontosan vetünk össze a builddel.
          for directory in /tmp/quantum-api-local /tmp/quantum-api-remote; do
            jq -S . "$directory/package/package.json" > "$directory/package/normalized.json"
            mv "$directory/package/normalized.json" "$directory/package/package.json"
          done
          diff -qr /tmp/quantum-api-local /tmp/quantum-api-remote
          test "$(npm view quantum_directus_api dist-tags.latest)" = "$latest_before"
          test "$(npm view quantum_directus_api dist-tags.canary)" = "$VERSION"
