name: Quantum Embedded Runtime

on:
  pull_request:
    branches:
      - 10.10.8-quantum
  push:
    branches:
      - 10.10.8-quantum
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantum-embedded-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max_old_space_size=6144

jobs:
  validate:
    name: Quantum Embedded / Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.4
          run_install: false

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changed files
        run: pnpm --filter quantum_directus_api check:changed

      - name: Check documentation spelling
        run: pnpm --filter docs spellcheck

      # A forrás-tesztek is a workspace package-ek publikus dist entrypointjait
      # fogyasztják. Clean runneren ezért a dependency-gráfot a Vitest előtt kell
      # felépíteni; lokálisan ezt könnyen elfedné egy korábbról megmaradt dist.
      - name: Build API dependency graph
        run: pnpm --filter quantum_directus_api... build
        env:
          npm_config_workspace_concurrency: '1'

      - name: Run embedded runtime tests
        run: pnpm --filter quantum_directus_api test:embedded

      - name: Test environment contract
        run: pnpm --filter @directus/env test

      - name: Build workspace
        run: pnpm build
        env:
          npm_config_workspace_concurrency: '1'

      - name: Build documentation
        run: pnpm --filter docs build:typedocs && pnpm --filter docs build:docs
        env:
          DOCS_SKIP_REMOTE_DATA: 'true'

  blackbox:
    name: Quantum Embedded / Flow (${{ matrix.vendor }})
    runs-on: ${{ matrix.vendor == 'mssql' && 'ubuntu-20.04' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        vendor:
          - sqlite3
          - postgres
          - mysql
          - maria
          - mssql
          - oracle
          - cockroachdb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Start mssql
        if: matrix.vendor == 'mssql'
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          sudo add-apt-repository "$(wget -qO- https://packages.microsoft.com/config/ubuntu/20.04/mssql-server-2019.list)"
          sudo apt-get update
          sudo apt-get install -y mssql-server
          sudo /opt/mssql/bin/mssql-conf set network.tcpport 6105
          sudo MSSQL_PID='express' MSSQL_SA_PASSWORD='Test@123' /opt/mssql/bin/mssql-conf -n setup accept-eula

      - name: Start database
        if: matrix.vendor != 'sqlite3' && matrix.vendor != 'mssql'
        run: docker compose -f tests/blackbox/docker-compose.yml up ${{ matrix.vendor }} -d --quiet-pull --wait

      - name: Start services
        run:
          docker compose -f tests/blackbox/docker-compose.yml up auth-saml redis minio minio-mc -d --quiet-pull --wait

      - name: Run trusted Flow blackbox
        run: pnpm run test:blackbox -- --project db
        env:
          TEST_DB: ${{ matrix.vendor }}
          QUANTUM_RUN_SCRIPT_BLACKBOX: 'true'

  artifact:
    name: Quantum Embedded / Artifact (${{ matrix.label }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Node 18
            consumer_node: 18
            runtime: node
          - label: Node 22
            consumer_node: 22
            runtime: node
          - label: Bun 1.3.14
            consumer_node: 18
            runtime: bun
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A monorepo deklarált build-toolchainje Node 18, és néhány csak buildhez
      # szükséges legacy dependency engine-tartománya nem fogadja el a Node 22-t.
      # A csomag fogyasztói runtime-ját ettől külön, a build után választjuk ki.
      - name: Install build Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.4
          run_install: false

      - name: Install Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify build toolchain
        run: |
          node --version
          pnpm --version

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API dependency graph
        run: pnpm --filter quantum_directus_api... build
        env:
          npm_config_workspace_concurrency: '1'

      - name: Install consumer Node.js
        if: matrix.consumer_node == 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify consumer runtime
        run: |
          node --version
          if [ "${{ matrix.runtime }}" = "bun" ]; then bun --version; fi

      - name: Run packed artifact smoke
        run: pnpm --filter quantum_directus_api test:artifact
        env:
          DIRECTUS_ARTIFACT_PNPM: pnpm
          DIRECTUS_ARTIFACT_RUNTIME: ${{ matrix.runtime }}
