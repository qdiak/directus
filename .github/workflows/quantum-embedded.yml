name: Quantum Embedded Runtime

on:
  pull_request:
    branches:
      - 10.10.8-quantum
  push:
    branches:
      - 10.10.8-quantum
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantum-embedded-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max_old_space_size=6144

jobs:
  validate:
    name: Quantum Embedded / Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.4
          run_install: false

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changed files
        run: pnpm --filter quantum_directus_api check:changed

      - name: Run embedded runtime tests
        run: pnpm --filter quantum_directus_api test:embedded

      - name: Build workspace
        run: pnpm build
        env:
          npm_config_workspace_concurrency: '1'

  artifact:
    name: Quantum Embedded / Artifact (${{ matrix.label }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Node 18
            node: 18
            runtime: node
            sandbox: '1'
          - label: Node 22
            node: 22
            runtime: node
            sandbox: '1'
          - label: Bun 1.3.14
            node: 22
            runtime: bun
            sandbox: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.4
          run_install: false

      - name: Install Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          if [ "${{ matrix.runtime }}" = "bun" ]; then bun --version; fi

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API dependency graph
        run: pnpm --filter quantum_directus_api... build
        env:
          npm_config_workspace_concurrency: '1'

      - name: Run packed artifact smoke
        run: pnpm --filter quantum_directus_api test:artifact
        env:
          DIRECTUS_ARTIFACT_PNPM: pnpm
          DIRECTUS_ARTIFACT_RUNTIME: ${{ matrix.runtime }}
          DIRECTUS_ARTIFACT_SANDBOX: ${{ matrix.sandbox }}
